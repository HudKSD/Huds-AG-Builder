services:
  nl-es-mvp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nl-es-mvp
    ports:
      - "8800:8000"
    env_file:
      - .env
    volumes:
      - ./certs:/certs:ro

  enricher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nl-es-enricher
    env_file:
      - .env
    command: ["python", "-m", "app.enrichment.worker"]
    volumes:
      - ./certs:/certs:ro

